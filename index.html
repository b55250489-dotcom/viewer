<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viewer</title>

<style>
    :root {
        --bg: #07090e;
        --surface: #0d1119;
        --surface2: #151b26;
        --border: rgba(255,255,255,.08);
        --text: #f5f7fb;
        --muted: #7f8999;
        --blue: #4d8cff;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
    }

    .browser {
        width: 100%;
        height: 100vh;

        display: flex;
        flex-direction: column;
    }

    /* TOP BAR */

    .topbar {
        height: 62px;
        flex-shrink: 0;

        padding: 0 12px;

        display: flex;
        align-items: center;
        gap: 8px;

        background: var(--surface);

        border-bottom: 1px solid var(--border);
    }

    /* NAV BUTTONS */

    .nav-btn {
        width: 38px;
        height: 38px;

        flex-shrink: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: var(--surface2);
        color: #a9b2c1;

        border: 1px solid var(--border);
        border-radius: 9px;

        font-size: 16px;

        cursor: pointer;

        transition: .15s;
    }

    .nav-btn:hover {
        background: #1c2432;
        color: white;
    }

    /* ADDRESS BAR */

    .address {
        height: 40px;
        flex: 1;

        display: flex;
        align-items: center;

        overflow: hidden;

        background: #070a10;

        border: 1px solid rgba(255,255,255,.09);
        border-radius: 10px;
    }

    .address-icon {
        padding-left: 14px;

        color: #697386;

        font-size: 11px;
    }

    #url {
        width: 100%;
        height: 100%;

        padding: 0 12px;

        background: transparent;
        color: #e8ebf0;

        border: none;
        outline: none;

        font-size: 13px;
    }

    #url::placeholder {
        color: #555f70;
    }

    /* GO BUTTON */

    .go {
        height: 38px;

        padding: 0 18px;

        flex-shrink: 0;

        background: var(--blue);
        color: white;

        border: none;
        border-radius: 9px;

        font-size: 11px;
        font-weight: 700;

        cursor: pointer;
    }

    .go:hover {
        background: #669cff;
    }

    /* CONTENT */

    .view {
        position: relative;

        flex: 1;

        background: #05070a;
    }

    #viewer {
        width: 100%;
        height: 100%;

        display: none;

        background: #000;

        border: none;
    }

    /* HOME */

    #home {
        position: absolute;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background:
            radial-gradient(
                circle at 50% 30%,
                rgba(77,140,255,.13),
                transparent 35%
            ),
            var(--bg);
    }

    .home-content {
        width: min(540px, 90%);

        text-align: center;
    }

    .logo {
        width: 60px;
        height: 60px;

        margin: 0 auto 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        background:
            linear-gradient(
                135deg,
                #3979ee,
                #6ca4ff
            );

        border-radius: 15px;

        box-shadow:
            0 15px 45px
            rgba(77,140,255,.25);

        font-size: 22px;
        font-weight: 800;
    }

    h1 {
        font-size: 38px;

        letter-spacing: -1.5px;
    }

    .description {
        margin-top: 10px;

        color: var(--muted);

        font-size: 13px;
        line-height: 1.6;
    }

    /* HOME SEARCH */

    .home-search {
        height: 50px;

        margin-top: 28px;

        display: flex;

        overflow: hidden;

        background: #0c1119;

        border: 1px solid rgba(255,255,255,.09);
        border-radius: 12px;
    }

    #homeUrl {
        flex: 1;

        padding: 0 16px;

        background: transparent;
        color: white;

        border: none;
        outline: none;

        font-size: 13px;
    }

    .home-go {
        margin: 5px;

        padding: 0 20px;

        background: var(--blue);
        color: white;

        border: none;
        border-radius: 8px;

        font-size: 11px;
        font-weight: 700;

        cursor: pointer;
    }

    .notice {
        margin-top: 18px;

        color: #505b6b;

        font-size: 10px;
        line-height: 1.6;
    }

    @media (max-width: 600px) {
        .topbar {
            padding: 0 7px;
            gap: 5px;
        }

        .nav-btn {
            width: 34px;
        }

        .go {
            padding: 0 12px;
        }

        h1 {
            font-size: 30px;
        }
    }
</style>
</head>

<body>

<div class="browser">

    <div class="topbar">

        <button
            class="nav-btn"
            onclick="goHome()"
            title="Home">
            ⌂
        </button>

        <button
            class="nav-btn"
            onclick="reloadPage()"
            title="Reload">
            ↻
        </button>

        <div class="address">

            <span class="address-icon">
                ◇
            </span>

            <input
                id="url"
                type="text"
                placeholder="Enter a website URL"
                autocomplete="off"
                spellcheck="false">

        </div>

        <button
            class="go"
            onclick="navigate()">
            GO
        </button>

    </div>


    <div class="view">

        <div id="home">

            <div class="home-content">

                <div class="logo">
                    V
                </div>

                <h1>Viewer</h1>

                <p class="description">
                    Open supported websites and embedded
                    content without leaving Viewer.
                </p>

                <div class="home-search">

                    <input
                        id="homeUrl"
                        type="text"
                        placeholder="Enter a URL..."
                        autocomplete="off"
                        spellcheck="false">

                    <button
                        class="home-go"
                        onclick="navigateHome()">
                        OPEN
                    </button>

                </div>

                <p class="notice">
                    Some websites prevent their normal pages
                    from being displayed inside other websites.
                    Supported official embeds are used when available.
                </p>

            </div>

        </div>


        <iframe
            id="viewer"
            allowfullscreen
            allow="autoplay; fullscreen; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

    </div>

</div>


<script>
const viewer = document.getElementById("viewer");
const home = document.getElementById("home");
const urlInput = document.getElementById("url");
const homeInput = document.getElementById("homeUrl");


/* -----------------------------
   CLEAN URL
----------------------------- */

function cleanURL(value) {

    value = value.trim();

    if (!value) {
        return null;
    }

    if (
        !value.startsWith("http://") &&
        !value.startsWith("https://")
    ) {
        value = "https://" + value;
    }

    try {

        const parsed = new URL(value);

        if (
            parsed.protocol !== "http:" &&
            parsed.protocol !== "https:"
        ) {
            return null;
        }

        return parsed;

    } catch {

        return null;

    }
}


/* -----------------------------
   TWITCH
----------------------------- */

function getTwitchEmbed(parsed) {

    const host = parsed.hostname
        .replace(/^www\./, "")
        .toLowerCase();

    if (host !== "twitch.tv") {
        return null;
    }

    const parts = parsed.pathname
        .split("/")
        .filter(Boolean);

    if (parts.length === 0) {
        return null;
    }

    const channel = parts[0];

    const reserved = [
        "directory",
        "downloads",
        "jobs",
        "turbo",
        "settings",
        "subscriptions",
        "wallet"
    ];

    if (
        reserved.includes(
            channel.toLowerCase()
        )
    ) {
        return null;
    }

    const parent =
        window.location.hostname;

    return (
        "https://player.twitch.tv/?" +
        "channel=" +
        encodeURIComponent(channel) +
        "&parent=" +
        encodeURIComponent(parent) +
        "&autoplay=false"
    );
}


/* -----------------------------
   YOUTUBE
----------------------------- */

function getYouTubeEmbed(parsed) {

    const host = parsed.hostname
        .replace(/^www\./, "")
        .toLowerCase();

    let videoID = null;


    /* youtu.be/VIDEO */

    if (host === "youtu.be") {

        videoID = parsed.pathname
            .split("/")
            .filter(Boolean)[0];

    }


    /* youtube.com */

    if (
        host === "youtube.com" ||
        host === "m.youtube.com"
    ) {

        /* /watch?v= */

        if (
            parsed.pathname === "/watch"
        ) {
            videoID =
                parsed.searchParams.get("v");
        }


        /* /shorts/VIDEO */

        if (
            parsed.pathname.startsWith(
                "/shorts/"
            )
        ) {
            videoID =
                parsed.pathname.split("/")[2];
        }


        /* /embed/VIDEO */

        if (
            parsed.pathname.startsWith(
                "/embed/"
            )
        ) {
            videoID =
                parsed.pathname.split("/")[2];
        }
    }


    if (!videoID) {
        return null;
    }

    return (
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoID)
    );
}


/* -----------------------------
   DETECT EMBED
----------------------------- */

function getDestination(parsed) {

    const twitch =
        getTwitchEmbed(parsed);

    if (twitch) {

        return twitch;

    }


    const youtube =
        getYouTubeEmbed(parsed);

    if (youtube) {

        return youtube;

    }


    /* NORMAL WEBSITE */

    return parsed.href;
}


/* -----------------------------
   OPEN
----------------------------- */

function openURL(value) {

    const parsed =
        cleanURL(value);

    if (!parsed) {

        urlInput.value = "";

        urlInput.placeholder =
            "Invalid URL";

        return;
    }


    /* Show original URL */

    urlInput.value =
        parsed.href;


    /* Determine actual iframe URL */

    const destination =
        getDestination(parsed);


    home.style.display =
        "none";

    viewer.style.display =
        "block";

    viewer.src =
        destination;
}


/* -----------------------------
   BUTTONS
----------------------------- */

function navigate() {

    openURL(
        urlInput.value
    );
}


function navigateHome() {

    openURL(
        homeInput.value
    );
}


function goHome() {

    viewer.src =
        "about:blank";

    viewer.style.display =
        "none";

    home.style.display =
        "flex";

    urlInput.value =
        "";

    homeInput.value =
        "";
}


function reloadPage() {

    if (
        !viewer.src ||
        viewer.src === "about:blank"
    ) {
        return;
    }

    const current =
        viewer.src;

    viewer.src =
        "about:blank";

    setTimeout(
        function() {
            viewer.src = current;
        },
        50
    );
}


/* -----------------------------
   ENTER KEY
----------------------------- */

urlInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            navigate();
        }

    }
);


homeInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            navigateHome();
        }

    }
);
</script>

</body>
</html>
