<script>
const viewer = document.getElementById("viewer");
const home = document.getElementById("home");
const urlInput = document.getElementById("url");
const homeInput = document.getElementById("homeUrl");

function cleanURL(value) {
    value = value.trim();

    if (!value) {
        return null;
    }

    if (
        !value.startsWith("http://") &&
        !value.startsWith("https://")
    ) {
        value = "https://" + value;
    }

    try {
        const parsed = new URL(value);

        if (
            parsed.protocol !== "http:" &&
            parsed.protocol !== "https:"
        ) {
            return null;
        }

        return parsed;
    } catch {
        return null;
    }
}


/* --------------------------------
   TWITCH
-------------------------------- */

function getTwitchEmbed(parsed) {
    const host = parsed.hostname
        .replace("www.", "")
        .toLowerCase();

    if (host !== "twitch.tv") {
        return null;
    }

    const parts = parsed.pathname
        .split("/")
        .filter(Boolean);

    if (parts.length === 0) {
        return null;
    }

    const channel = parts[0];

    const reserved = [
        "directory",
        "downloads",
        "jobs",
        "turbo",
        "settings",
        "subscriptions",
        "wallet"
    ];

    if (reserved.includes(channel.toLowerCase())) {
        return null;
    }

    const parent = window.location.hostname;

    return (
        "https://player.twitch.tv/?" +
        "channel=" +
        encodeURIComponent(channel) +
        "&parent=" +
        encodeURIComponent(parent) +
        "&autoplay=false"
    );
}


/* --------------------------------
   YOUTUBE
-------------------------------- */

function getYouTubeEmbed(parsed) {
    const host = parsed.hostname
        .replace("www.", "")
        .toLowerCase();

    let videoID = null;

    if (host === "youtu.be") {
        videoID = parsed.pathname
            .split("/")
            .filter(Boolean)[0];
    }

    if (
        host === "youtube.com" ||
        host === "m.youtube.com"
    ) {
        if (parsed.pathname === "/watch") {
            videoID = parsed.searchParams.get("v");
        }

        if (parsed.pathname.startsWith("/shorts/")) {
            videoID = parsed.pathname.split("/")[2];
        }

        if (parsed.pathname.startsWith("/embed/")) {
            videoID = parsed.pathname.split("/")[2];
        }
    }

    if (!videoID) {
        return null;
    }

    return (
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoID)
    );
}


/* --------------------------------
   DETECT SUPPORTED EMBEDS
-------------------------------- */

function getEmbedURL(parsed) {
    const twitch = getTwitchEmbed(parsed);

    if (twitch) {
        return {
            url: twitch,
            type: "Twitch"
        };
    }

    const youtube = getYouTubeEmbed(parsed);

    if (youtube) {
        return {
            url: youtube,
            type: "YouTube"
        };
    }

    return {
        url: parsed.href,
        type: "Website"
    };
}


/* --------------------------------
   OPEN URL
-------------------------------- */

function openURL(value) {
    const parsed = cleanURL(value);

    if (!parsed) {
        urlInput.value = "";
        urlInput.placeholder = "Invalid URL";
        return;
    }

    const result = getEmbedURL(parsed);

    /* Keep original URL visible */
    urlInput.value = parsed.href;

    home.style.display = "none";
    viewer.style.display = "block";

    viewer.src = result.url;
}


/* --------------------------------
   NAVIGATION
-------------------------------- */

function navigate() {
    openURL(urlInput.value);
}

function navigateHome() {
    openURL(homeInput.value);
}

function goHome() {
    viewer.src = "about:blank";

    viewer.style.display = "none";
    home.style.display = "flex";

    urlInput.value = "";
    homeInput.value = "";
}

function reloadPage() {
    if (
        !viewer.src ||
        viewer.src === "about:blank"
    ) {
        return;
    }

    const current = viewer.src;

    viewer.src = "about:blank";

    setTimeout(() => {
        viewer.src = current;
    }, 50);
}


/* --------------------------------
   ENTER KEY
-------------------------------- */

urlInput.addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            navigate();
        }
    }
);

homeInput.addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            navigateHome();
        }
    }
);
</script>
